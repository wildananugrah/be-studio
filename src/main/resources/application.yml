spring:
  application:
    name: json-gateway
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # no default static files (/**, /webjars/**): Studio serves /studio/** and the API docs /webjars/swagger-ui/**
      # only when they are enabled, so a production build with both off serves the API and nothing else
      add-mappings: false
  datasource:
    # HikariCP is the only pool on the classpath and is pinned here (spec Section 4.1)
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: gateway-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}
      register-mbeans: true
  # uploads (multipart/form-data): limits come from gateway.files.max-size
  servlet:
    multipart:
      max-file-size: ${gateway.files.max-size}
      max-request-size: ${gateway.files.max-request-size}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # "dev" adds the demo flows; set LIQUIBASE_ENABLED=false when DBAs apply DDL themselves
    contexts: ${LIQUIBASE_CONTEXTS:default}
    enabled: ${LIQUIBASE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

gateway:
  api-base-path: /api
  default-flow-timeout-ms: 30000
  default-step-timeout-ms: 10000
  admin:
    token: ${GATEWAY_ADMIN_TOKEN:}
  # API documentation generated from the flow configuration: Swagger UI at /docs, OpenAPI at /docs/openapi.json.
  # Off unless enabled; it lists every endpoint, so think twice before enabling it in production.
  docs:
    enabled: ${GATEWAY_DOCS_ENABLED:false}
    title: ${GATEWAY_DOCS_TITLE:JSON Gateway API}
  # Gateway Studio: browser UI at /studio for editing flows, target systems and lookups. Its API needs the admin
  # token and writes straight to the config tables, then reloads. Keep it off in production.
  #   mode: edit      - full editor (Save & reload, test runs)
  #   mode: view-only - browse flows, mappings, targets, lookups, schemas, previews and the SQL, but nothing can be
  #                     saved and no test runs (they would call the downstream systems); the server enforces it
  #   log-buffer      - log lines kept in memory per correlation ID for the Audit trail screen (this instance only,
  #                     lost on restart; the log output stays the record)
  studio:
    enabled: ${GATEWAY_STUDIO_ENABLED:false}
    mode: ${GATEWAY_STUDIO_MODE:edit}
    log-buffer:
      max-transactions: 2000
      max-lines: 300
  # Studio's project assistant (the "Ask" button): Claude via the Anthropic Messages API. Needs studio enabled too;
  # false removes the Ask button and its API, and nothing calls the AI endpoint. Connection settings are AI_BASE_URL
  # (optional, default https://api.anthropic.com), AI_AUTH_KEY, AI_MODEL (default claude-opus-5-5), optional
  # AI_AUTH_TYPE and AI_EFFORT; taken from the environment first, then from env-file (git-ignored, never committed).
  assistant:
    enabled: ${GATEWAY_ASSISTANT_ENABLED:true}
    env-file: ${GATEWAY_ASSISTANT_ENV_FILE:.env}
    max-tokens: 64000
    history-messages: 20
  audit:
    enabled: ${GATEWAY_AUDIT_ENABLED:true}
    store-payloads: true
    queue-capacity: 10000
    batch-size: 100
  masking:
    # comma-separated; GATEWAY_MASKING_FIELDS replaces the whole list, so repeat the defaults you still want
    fields: ${GATEWAY_MASKING_FIELDS:pin,password,cardNo,cvv,authorization,x-admin-token}
    mask: "****"
  db:
    schema: ${DB_SCHEMA:}
    tables:
      flow: gw_flow
      flow-step: gw_flow_step
      mapping-rule: gw_mapping_rule
      lookup-entry: gw_lookup_entry
      json-schema: gw_json_schema
      audit-transaction: gw_audit_transaction
      audit-step: gw_audit_step
      storage: gw_storage
    liquibase-tables:
      changelog: gw_db_changelog
      changelog-lock: gw_db_changelog_lock
  # Databases for database query steps (a step with sql_text; its target_system names one of these). The SQL uses
  # :name parameters, bound from the step's request mapping (BODY rules writing $.name); the result is the step's
  # body: {rows: [...], rowCount, truncated} for a query, {updated: n} otherwise. Values are always bound, never
  # pasted into the SQL. A datasource without url is the gateway's own database.
  #   read-only: true  - only SELECT / WITH, run in a read-only transaction (the database refuses writes)
  #   max-rows         - more rows than this are cut off and reported as truncated: true
  sql:
    max-rows: 1000
    datasources:
      GATEWAY_DB:
        url: ${GATEWAY_SQL_DB_URL:}         # empty = the gateway's own database
        read-only: ${GATEWAY_SQL_DB_READ_ONLY:true}
      # REPORTING:
      #   url: jdbc:postgresql://reporting-db:5432/reports
      #   username: ${REPORTING_DB_USER}
      #   password: ${REPORTING_DB_PASSWORD}
      #   max-pool-size: 5
      #   read-only: true
  # Uploads. Besides JSON the gateway accepts multipart/form-data (text fields -> $.request.body, files ->
  # $.request.files.<field>), application/x-www-form-urlencoded (fields -> $.request.body) and raw binary bodies
  # (PDF, images, Office files, zip, octet-stream -> $.request.files.body). Larger uploads get 413 GW-413-FILE.
  files:
    max-size: ${GATEWAY_FILES_MAX_SIZE:20MB}            # one file (or one raw body)
    max-request-size: ${GATEWAY_FILES_MAX_REQUEST_SIZE:25MB}
  # Where file storage steps put files, besides the storages in the database (Studio > Storages, gw_storage, which
  # win on the same name). A step whose target_system is one of these is a file storage step (http_method PUT stores,
  # DELETE removes; path_template is the object key, e.g. /{yyyy}/{MM}/{uuid}-{filename}).
  #   type: local - a directory (base-dir); type: s3 - a bucket (AWS, or S3-compatible such as MinIO via endpoint)
  #   allowed-types / max-size - checked before storing (415 GW-415-FILE / 413 GW-413-FILE)
  storages:
    LOCAL_FILES:
      type: local
      base-dir: ${GATEWAY_FILES_DIR:./data/files}
      allowed-types: image/*,application/pdf,text/csv,text/plain,application/octet-stream
      max-size: 10MB
    # S3 storages are usually configured in Gateway Studio > Storages (table gw_storage; database rows win over
    # these). They can also live here, e.g.:
    # S3_ARCHIVE:
    #   type: s3
    #   bucket: ${S3_BUCKET}
    #   prefix: uploads/
    #   region: ap-southeast-1
    #   endpoint: ${S3_ENDPOINT:}          # S3-compatible servers (MinIO, ...); with path-style: true
    #   path-style: false
    #   access-key: ${S3_ACCESS_KEY:}      # empty = default AWS credentials (env, profile, instance role)
    #   secret-key: ${S3_SECRET_KEY:}
  # Downstream systems, per environment. Example:
  # target-systems:
  #   CORE_BANKING:
  #     base-url: https://core.internal/api
  #     connect-timeout-ms: 3000
  #     read-timeout-ms: 10000
  #     static-headers:
  #       X-Channel-Id: GATEWAY
  #     body-codec: soapCodec   # wire format: jsonCodec (default), xmlCodec, soapCodec, soap12Codec or a custom BodyCodec bean

# Settings of the example custom classes (com.mhamzah.gateway.extension.custom, docs/CUSTOM-CLASSES.md)
custom:
  channel-guard:
    allowed: ${GATEWAY_CHANNEL_GUARD_ALLOWED:MOBILE,ATM,WEB}
  request-signer:
    secret: ${REQUEST_SIGNER_SECRET:dev-signing-secret}   # set REQUEST_SIGNER_SECRET outside dev
  partner-soap:
    username: ${PARTNER_SOAP_USERNAME:dev-user}
    password: ${PARTNER_SOAP_PASSWORD:dev-password}   # set PARTNER_SOAP_PASSWORD outside dev

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

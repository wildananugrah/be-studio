# Oracle database. Combine with an environment profile, e.g. --spring.profiles.active=oracle,uat
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      data-source-properties:
        oracle.jdbc.implicitStatementCacheSize: 50
        oracle.net.CONNECT_TIMEOUT: 5000
